name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source inventory, syntax and links
        run: python tools/check_repository.py
      - name: Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libpulse0
      - name: GUI test dependencies (no model backend)
        run: python -m pip install -r requirements-gui.txt
      - name: Isolated source checks
        run: python tools/run_source_checks.py
